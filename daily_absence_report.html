<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كشف متابعة حالة الغياب اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--navy:#1b3a6b;--teal:#0f766e;--gold:#b7791f;--line:#1f2937;--soft:#eef2f7;--bg:#e8edf3}
*{box-sizing:border-box}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:18px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:600 .95rem inherit;font-family:inherit;color:#fff;cursor:pointer}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b-navy{background:var(--navy)}.b-teal{background:var(--teal)}.b-gold{background:var(--gold)}
.auth{max-width:380px;margin:80px auto;background:#fff;padding:28px;border-radius:14px;text-align:center;box-shadow:0 12px 30px rgba(20,33,61,.15)}
.auth img{max-width:100%;max-height:90px}
.auth input{width:100%;padding:12px;margin:14px 0;border:1px solid #c5cedb;border-radius:8px;text-align:center;font:inherit}
.bar{max-width:1250px;margin:0 auto 14px;background:#fff;border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{font-weight:600;font-size:.9rem}
.bar input,.bar select{padding:8px 10px;border:1px solid #c5cedb;border-radius:8px;font:inherit;font-size:.9rem;background:#fff}
.stats{max-width:1250px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{background:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:.9rem;border:1px solid #d3dbe6}
.chip b{color:var(--navy);margin-inline-start:4px}
#saveState{margin-inline-start:auto;font-size:.85rem;font-weight:600;color:var(--teal)}
#saveState.dirty{color:#b91c1c}
/* الصفحة */
.page{background:#fff;max-width:1250px;margin:0 auto 18px;padding:18px 22px;border-radius:6px;box-shadow:0 8px 24px rgba(20,33,61,.12);display:flex;flex-direction:column}
.hd{text-align:center;border-bottom:3px solid var(--navy);padding-bottom:6px;position:relative}
.hd img{max-height:70px;display:block;margin:0 auto 4px}
.hd h2{margin:0;font-size:1.35rem;font-weight:700;color:var(--navy)}
.meta{display:flex;justify-content:center;gap:34px;margin-top:6px;font-weight:600;font-size:.95rem}
.meta span span{border-bottom:1px solid var(--line);padding:0 12px;display:inline-block;min-width:70px}
.pg{position:absolute;left:0;top:6px;font-size:.8rem;font-weight:600;color:var(--gold)}
table{width:100%;border-collapse:collapse;margin-top:8px;table-layout:fixed}
th,td{border:1px solid var(--line);padding:6px 7px;vertical-align:middle;text-align:center;font-size:12.5px}
th{background:var(--soft);font-weight:700;color:var(--navy);padding:8px 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
tbody tr{height:37mm}
td.nm{font-weight:700;text-align:right;font-size:13px}
td.op{text-align:right;line-height:1.7}
.opt{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer}
.opt input{margin:0;width:13px;height:13px;accent-color:#000}
.ti{width:100%;border:0;border-bottom:1px dashed #555;background:transparent;font:inherit;font-size:12px;padding:3px;text-align:center;outline:0}
.ti:focus{border-bottom:1px solid var(--teal)}
.empty td{height:auto!important;padding:40px;font-weight:700;color:var(--teal);font-size:1.1rem}
.ft{display:flex;justify-content:space-around;gap:20px;margin-top:auto;padding-top:8px;font-weight:600;font-size:.88rem}
.ft div{flex:1;text-align:center}
.ft small{display:block;font-weight:500;font-size:.85rem;margin-top:2px}
.ft i{display:block;border-bottom:1px dotted #000;height:26px;margin-top:6px}
.ft em{font-style:normal;font-weight:500;font-size:.78rem;color:#555}
.by{text-align:center;margin-top:8px;padding-top:5px;border-top:1px solid var(--navy);font-weight:600;font-size:.82rem;color:var(--navy)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;display:none;z-index:9}
.load{text-align:center;padding:50px;font-weight:700;color:var(--navy);display:none}
@media(max-width:900px){.page{overflow-x:auto}table{min-width:1000px}}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body{background:#fff;padding:0}
 .bar,.stats,.auth,.toast,.load{display:none!important}
 .page{box-shadow:none;border-radius:0;margin:0;padding:0;max-width:none;height:192mm;break-after:page;page-break-after:always;overflow:hidden}
 .page:last-child{break-after:auto;page-break-after:auto}
 .ti{border-bottom:1px dotted #000}
}
</style>
</head>
<body>

<div id="auth" class="auth">
  <img src="https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png" alt="الترويسة">
  <h2 style="color:var(--navy)">سجل الغياب اليومي</h2>
  <input type="password" id="pass" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()">
  <button class="btn b-navy" style="width:100%" onclick="login()">دخول</button>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <div class="grp">
      <label>التاريخ</label><input type="date" id="date" onchange="loadLive()">
      <label>الصف</label><select id="cls" onchange="render()"><option value="">كل الصفوف</option></select>
      <label>سجلات محفوظة</label><select id="saved" onchange="loadSaved(this.value)"><option value="">اختر تاريخاً…</option></select>
    </div>
    <div class="grp">
      <button class="btn b-navy" onclick="loadLive()">سحب الغياب الحالي</button>
      <button class="btn b-teal" onclick="saveLog()">حفظ في السجل</button>
      <button class="btn b-gold" onclick="window.print()">طباعة A4</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="load" class="load">جاري جلب البيانات…</div>
  <div id="sheet"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxlJnpJN9y9h04cOswtY3BGGwUS8rhybOisxDFkIQJ6_9nFSPMJeK-wiuFEECnBY3v5/exec";
const PER_PAGE=3;
const STATUS=["غياب","بعذر","بدون عذر","انقطاع"];
const ACTS=["إشعار بالغياب عبر SMS أو WhatsApp","الاتصال بولي الأمر","إشعار ولي الأمر المسبق بالغياب","تواصل ولي الأمر مع المعلم"];
const RESP=["تم الرد","لا يوجد رد","الهاتف مغلق"];
let PASS="",rows=[],curDate="";

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=n=>String(n||'').replace(/^[\d\s._-]+/,'').trim();
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function dayName(d){return ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][new Date(d+'T12:00:00').getDay()]||''}
function dirty(on=true){const s=$('saveState');if(s){s.textContent=on?'● تغييرات غير محفوظة':'✓ محفوظ';s.className=on?'dirty':''}}

document.addEventListener('DOMContentLoaded',()=>{$('date').value=new Date().toLocaleDateString('en-CA')});

async function login(){
  PASS=$('pass').value.trim();
  if(!PASS)return toast('أدخل كلمة المرور');
  $('auth').style.display='none';$('app').style.display='block';
  const ok=await loadLive();
  if(!ok){$('auth').style.display='block';$('app').style.display='none'}
  else refreshSavedDates();
}

async function refreshSavedDates(){
  try{
    const r=await fetch(`${SCRIPT_URL}?action=listAbsenceLogDates&pass=${encodeURIComponent(PASS)}`).then(r=>r.json());
    const sel=$('saved');sel.innerHTML='<option value="">اختر تاريخاً…</option>';
    (r.dates||[]).forEach(d=>sel.innerHTML+=`<option value="${d}">${d} — ${dayName(d)}</option>`);
  }catch(e){}
}

async function loadLive(){
  curDate=$('date').value;
  $('sheet').innerHTML='';$('load').style.display='block';
  try{
    const [a,s]=await Promise.all([
      fetch(`${SCRIPT_URL}?action=supervisor&pass=${encodeURIComponent(PASS)}`).then(r=>r.json()),
      fetch(`${SCRIPT_URL}?action=social_init&pass=social123`).then(r=>r.json())
    ]);
    if(a.status!=="success"){toast(a.message||'خطأ في جلب البيانات');$('load').style.display='none';return false}
    buildRows(a,s.fullDataMap||{});
    $('load').style.display='none';
    render();dirty(true);return true;
  }catch(e){toast('تعذر الاتصال بالخادم');$('load').style.display='none';return false}
}

function buildRows(api,map){
  const ex={},late={},periods={},stu={};
  (api.excuses||[]).forEach(e=>{if(e.date===curDate)ex[clean(e.studentName)]=e});
  (api.lates||[]).forEach(l=>{if(l.date===curDate)late[clean(l.studentName)]=1});
  (api.data||[]).forEach(r=>{
    if(r.date!==curDate||r.studentName.includes('لا يوجد'))return;
    const p=String(r.period),n=clean(r.studentName);
    (periods[r.className]=periods[r.className]||new Set()).add(p);
    (stu[n]=stu[n]||{cls:r.className,raw:r.studentName,p:new Set()}).p.add(p);
  });
  rows=[];
  Object.keys(stu).forEach(n=>{
    if(late[n])return;
    const s=stu[n],tot=periods[s.cls]?periods[s.cls].size:0;
    if(tot>0&&s.p.size>=tot){
      const m=map[n]||{};
      rows.push({name:s.raw,cls:s.cls,phone:m["رقم الهاتف المعتمد (واتساب)"]||"",
        status:ex[n]?"بعذر":"بدون عذر",acts:[false,false,false,false],other:"",resp:"",reason:ex[n]?ex[n].reason:""});
    }
  });
  rows.sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
  const sel=$('cls');sel.innerHTML='<option value="">كل الصفوف</option>';
  [...new Set(rows.map(r=>r.cls))].forEach(c=>sel.innerHTML+=`<option>${esc(c)}</option>`);
}

async function loadSaved(d){
  if(!d)return;
  $('date').value=d;curDate=d;$('load').style.display='block';$('sheet').innerHTML='';
  try{
    const r=await fetch(`${SCRIPT_URL}?action=getAbsenceLog&pass=${encodeURIComponent(PASS)}&date=${d}`).then(r=>r.json());
    $('load').style.display='none';
    if(r.status!=="success"||!r.rows.length){toast('لا يوجد سجل محفوظ لهذا التاريخ');return}
    rows=r.rows.map(x=>{
      const parts=String(x.actions||'').split(/\s*،\s*/).filter(Boolean);
      const oth=parts.find(p=>p.startsWith('أخرى:'));
      return{name:x.name,cls:x.cls,phone:x.phone,status:x.status,resp:x.resp,reason:x.reason,
        acts:ACTS.map(a=>parts.includes(a)),other:oth?oth.replace('أخرى:','').trim():""};
    });
    const sel=$('cls');sel.innerHTML='<option value="">كل الصفوف</option>';
    [...new Set(rows.map(r=>r.cls))].forEach(c=>sel.innerHTML+=`<option>${esc(c)}</option>`);
    render();dirty(false);toast('تم استرجاع السجل المحفوظ');
  }catch(e){$('load').style.display='none';toast('تعذر جلب السجل')}
}

async function saveLog(){
  if(!rows.length)return toast('لا توجد بيانات للحفظ');
  const payload={action:"saveAbsenceLog",pass:PASS,date:curDate,day:dayName(curDate),
    rows:rows.map(r=>({name:r.name,cls:r.cls,phone:r.phone,status:r.status,
      actions:[...ACTS.filter((a,i)=>r.acts[i]),...(r.other?['أخرى: '+r.other]:[])].join(' ، '),
      resp:r.resp,reason:r.reason}))};
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(r=>r.json());
    if(r.status==="success"){dirty(false);toast('تم حفظ السجل');refreshSavedDates()}else toast(r.message||'فشل الحفظ');
  }catch(e){toast('تعذر الحفظ')}
}

function set(i,k,v){rows[i][k]=v;dirty();if(k==='status')stats()}
function tog(i,k,v){rows[i].acts[k]=v;dirty()}

function stats(){
  const v=$('cls').value,l=rows.filter(r=>!v||r.cls===v),c=s=>l.filter(r=>r.status===s).length;
  $('stats').innerHTML=`<span class="chip">إجمالي الغياب الكلي<b>${l.length}</b></span><span class="chip">بعذر<b>${c('بعذر')}</b></span><span class="chip">بدون عذر<b>${c('بدون عذر')}</b></span><span class="chip">انقطاع<b>${c('انقطاع')}</b></span><span class="chip">عدد الصفحات<b>${Math.max(1,Math.ceil(l.length/PER_PAGE))}</b></span><span id="saveState"></span>`;
}

function rowHtml(o,n){
  const r=o.r,i=o.i;
  const st=STATUS.map((v,k)=>`<label class="opt"><input type="radio" name="st${i}" ${r.status===v?'checked':''} onchange="set(${i},'status',STATUS[${k}])">${v}</label>`).join('');
  const ac=ACTS.map((v,k)=>`<label class="opt"><input type="checkbox" ${r.acts[k]?'checked':''} onchange="tog(${i},${k},this.checked)">${v}</label>`).join('');
  const rs=RESP.map((v,k)=>`<label class="opt"><input type="radio" name="rs${i}" ${r.resp===v?'checked':''} onchange="set(${i},'resp',RESP[${k}])">${v}</label>`).join('');
  return`<tr><td><b>${n}</b></td><td class="nm">${esc(r.name)}</td><td>${esc(r.cls)}</td>
  <td><input class="ti" value="${esc(r.phone)}" oninput="set(${i},'phone',this.value)"></td>
  <td class="op">${st}</td>
  <td class="op">${ac}<label class="opt">أخرى:<input class="ti" value="${esc(r.other)}" oninput="set(${i},'other',this.value)"></label></td>
  <td class="op">${rs}</td>
  <td><input class="ti" value="${esc(r.reason)}" oninput="set(${i},'reason',this.value)"></td><td></td></tr>`;
}

function render(){
  const v=$('cls').value,list=rows.map((r,i)=>({r,i})).filter(o=>!v||o.r.cls===v);
  const pages=Math.max(1,Math.ceil(list.length/PER_PAGE));let h='';
  for(let p=0;p<pages;p++){
    const chunk=list.slice(p*PER_PAGE,p*PER_PAGE+PER_PAGE);
    const body=chunk.length?chunk.map((o,k)=>rowHtml(o,p*PER_PAGE+k+1)).join(''):'<tr class="empty"><td colspan="9">✅ لا يوجد غياب كلي مسجل لهذا اليوم</td></tr>';
    h+=`<section class="page">
    <div class="hd"><img src="https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png" alt="وزارة التربية والتعليم">
      <span class="pg">صفحة ${p+1} من ${pages}</span>
      <h2>كشف متابعة حالة الغياب اليومي</h2>
      <div class="meta"><span>المدرسة: <span>البلاد القديم الابتدائية الإعدادية للبنين</span></span><span>اليوم: <span>${dayName(curDate)}</span></span><span>التاريخ: <span dir="ltr">${curDate}</span></span></div></div>
    <table><colgroup><col style="width:3%"><col style="width:15%"><col style="width:8%"><col style="width:10%"><col style="width:10%"><col style="width:22%"><col style="width:10%"><col style="width:13%"><col style="width:9%"></colgroup>
    <thead><tr><th>م</th><th>اسم الطالب</th><th>الصف</th><th>أرقام التواصل</th><th>حالة الغياب</th><th>الإجراء المتخذ</th><th>حالة الاستجابة</th><th>سبب الغياب</th><th>اعتماد المبلغ</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="ft">
      <div>المرشد الاجتماعي<small>الأستاذ: السيد عبدالله الكامل</small><i></i><em>التوقيع</em></div>
      <div>المدير المساعد<small>الأستاذ: عبدالله أحمد دليم</small><i></i><em>التوقيع</em></div>
      <div>يعتمد مدير المدرسة<small>الأستاذ: محمد ابراهيم محمد ناصر</small><i></i><em>التوقيع</em></div>
    </div>
    <div class="by">إعداد: صبري محمد حمد</div>
    </section>`;
  }
  $('sheet').innerHTML=h;stats();
}
</script>
</body>
</html>
