<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تقديم الأعذار - مدرسة البلاد القديم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
            margin: 0; padding: 20px;
            color: #1f2937;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #1e3a8a; padding-bottom: 15px; }
        .header h2 { color: #1e3a8a; margin: 0; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #374151; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid #d1d5db;
            border-radius: 8px; font-family: inherit; font-size: 1rem;
            box-sizing: border-box;
        }
        .form-group input[readonly] { background-color: #f3f4f6; color: #6b7280; }
        
        .search-box { display: flex; gap: 10px; }
        .search-box input { flex: 1; }
        .search-box button {
            background: #2563eb; color: white; border: none;
            padding: 0 20px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold;
        }
        
        .btn-submit {
            width: 100%; background: #16a34a; color: white; border: none;
            padding: 15px; border-radius: 8px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; font-family: inherit; margin-top: 10px;
        }
        .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }
        
        #manualEntry { display: none; background: #fffbeb; padding: 15px; border-radius: 8px; border: 1px dashed #f59e0b; margin-bottom: 15px;}
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; font-weight: bold; text-align: center;}
        .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #f87171; }
        .alert-success { background: #dcfce3; color: #16a34a; border: 1px solid #4ade80; }
        .loader { display: none; text-align: center; color: #2563eb; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>تقديم عذر غياب طالب</h2>
        <p>مدرسة البلاد القديم الابتدائية الإعدادية للبنين</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <div class="form-group">
        <label>الرقم الشخصي للطالب:</label>
        <div class="search-box">
            <input type="number" id="cpr" placeholder="أدخل الرقم الشخصي للطالب">
            <button type="button" onclick="searchStudent()" id="searchBtn">بحث</button>
        </div>
    </div>

    <div id="manualEntry">
        <p style="color: #d97706; margin-top: 0;">لم يتم العثور على الرقم في النظام. يرجى إدخال البيانات يدوياً:</p>
        <div class="form-group">
            <label>اسم الطالب الرباعي:</label>
            <input type="text" id="manualName" placeholder="اكتب اسم الطالب">
        </div>
        <div class="form-group">
            <label>الصف:</label>
            <input type="text" id="manualClass" placeholder="مثال: ثاني إعدادي 3">
        </div>
    </div>

    <div id="studentDetails" style="display:none;">
        <div class="form-group">
            <label>اسم الطالب:</label>
            <input type="text" id="studentName" readonly>
        </div>
        <div class="form-group">
            <label>الصف:</label>
            <input type="text" id="studentClass" readonly>
        </div>
    </div>

    <div class="form-group">
        <label>تاريخ الغياب:</label>
        <input type="date" id="absenceDate">
    </div>

    <div class="form-group">
        <label>رقم هاتف ولي الأمر (للتواصل):</label>
        <input type="tel" id="parentPhone" placeholder="رقم الهاتف">
    </div>

    <div class="form-group">
        <label>سبب الغياب المكتوب:</label>
        <textarea id="reason" rows="3" placeholder="اذكر سبب الغياب باختصار..."></textarea>
    </div>

    <div class="form-group">
        <label>المرفقات (عذر طبي، تقرير، إلخ):</label>
        <p style="font-size: 0.85rem; color: #6b7280; margin-top:0;">يمكنك اختيار صورة من الاستوديو أو فتح الكاميرا للتصوير مباشرة.</p>
        <input type="file" id="fileUpload" multiple accept="image/*,application/pdf">
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitExcuse()">إرسال العذر</button>
    <div class="loader" id="loader">جاري رفع الملفات وإرسال العذر... يرجى الانتظار ولا تغلق الصفحة ⏳</div>
</div>

<script>
    // الرابط الفعلي لمشروعك تم دمجه هنا
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlJnpJN9y9h04cOswtY3BGGwUS8rhybOisxDFkIQJ6_9nFSPMJeK-wiuFEECnBY3v5/exec"; 

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('absenceDate').value = new Date().toLocaleDateString('en-CA');
    });

    function showAlert(message, isSuccess = false) {
        const alertBox = document.getElementById('alertBox');
        alertBox.textContent = message;
        alertBox.style.display = 'block';
        alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        window.scrollTo(0, 0);
    }

    function searchStudent() {
        const cpr = document.getElementById('cpr').value;
        if (!cpr) return showAlert("يرجى إدخال الرقم الشخصي أولاً");
        
        const btn = document.getElementById('searchBtn');
        btn.textContent = "جاري..."; btn.disabled = true;
        document.getElementById('alertBox').style.display = 'none';

        fetch(`${SCRIPT_URL}?action=searchCPR&cpr=${cpr}`)
            .then(res => res.json())
            .then(data => {
                btn.textContent = "بحث"; btn.disabled = false;
                if(data.status === "success") {
                    document.getElementById('manualEntry').style.display = 'none';
                    document.getElementById('studentDetails').style.display = 'block';
                    document.getElementById('studentName').value = data.studentName;
                    document.getElementById('studentClass').value = data.className;
                    showAlert("تم جلب بيانات الطالب بنجاح", true);
                } else {
                    document.getElementById('studentDetails').style.display = 'none';
                    document.getElementById('manualEntry').style.display = 'block';
                    showAlert("لم يتم العثور على الرقم، يرجى كتابة البيانات يدوياً بالأسفل.");
                }
            }).catch(err => {
                btn.textContent = "بحث"; btn.disabled = false;
                showAlert("حدث خطأ في الاتصال، يمكنك إدخال البيانات يدوياً.");
                document.getElementById('manualEntry').style.display = 'block';
            });
    }

    async function submitExcuse() {
        const cpr = document.getElementById('cpr').value;
        const absenceDate = document.getElementById('absenceDate').value;
        const parentPhone = document.getElementById('parentPhone').value;
        const reason = document.getElementById('reason').value;
        
        let sName = document.getElementById('studentName').value;
        let sClass = document.getElementById('studentClass').value;

        if (document.getElementById('manualEntry').style.display === 'block') {
            sName = document.getElementById('manualName').value;
            sClass = document.getElementById('manualClass').value;
        }

        if (!cpr || !sName || !sClass || !parentPhone) {
            return showAlert("يرجى التأكد من كتابة الرقم الشخصي والاسم والصف ورقم الهاتف.");
        }

        const fileInput = document.getElementById('fileUpload');
        const files = fileInput.files;
        let fileDataArray = [];

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('alertBox').style.display = 'none';

        if (files.length > 0) {
            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                let base64 = await new Promise((resolve) => {
                    let reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
                fileDataArray.push({
                    name: file.name,
                    mimeType: file.type,
                    base64: base64
                });
            }
        }

        const payload = {
            cpr: cpr,
            studentName: sName,
            className: sClass,
            absenceDate: absenceDate,
            parentPhone: parentPhone,
            reason: reason,
            files: fileDataArray
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'block';
            
            if(data.status === "success") {
                showAlert("✅ تم إرسال العذر والمرفقات بنجاح! شكراً لك.", true);
                setTimeout(() => { location.reload(); }, 3000);
            } else {
                showAlert("حدث خطأ أثناء الإرسال: " + data.message + " (حاول مرة أخرى)");
            }
        })
        .catch(err => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'block';
            showAlert("حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.");
        });
    }
</script>
</body>
</html>
