<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلمين - متابعة الغياب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f0fdf4; }
        .hidden { display: none; }
    </style>
</head>
<body class="text-gray-800">

    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 max-w-full border-t-4 border-green-600">
            <h1 class="text-2xl font-bold text-center text-green-700 mb-6">بوابة المعلمين</h1>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">اختر اسمك من القائمة:</label>
                <select id="teacherSelect" class="w-full p-2 border rounded mb-4">
                    <option value="">-- اضغط للاختيار --</option>
                    <option value="سفيان محمد">التربية الإسلامية - سفيان محمد نورفل</option>
                    <option value="محمد عبدالعزيز">التربية الإسلامية - محمد عبدالعزيز</option>
                    <option value="موسى مدن">التربية الإسلامية - موسى مدن حسين</option>
                    <option value="حسن علي محمد">التربية الرياضية - حسن علي محمد خميس</option>
                    <option value="حسين راشد">التربية الرياضية - حسين راشد حبيب</option>
                    <option value="عباس حسين فردان">التربية الرياضية - عباس حسين فردان حسين</option>
                    <option value="أحمد الشهابي">التربية الرياضية - أحمد الشهابي</option>
                    <option value="حمزة ميرزا">الرياضيات - حمزة ميرزا جعفر محمد</option>
                    <option value="لطفي ابراهيم">الرياضيات - لطفي ابراهيم لطفي</option>
                    <option value="طه عاطف">الرياضيات - طه عاطف طه عبداللطيف</option>
                    <option value="عبدالباسط محمد">الرياضيات - عبدالباسط محمد السيد محمد</option>
                    <option value="محمد علي محسن">الرياضيات - محمد علي محسن العلي</option>
                    <option value="محمد عبدالنبي">الرياضيات - محمد عبدالنبي العويناتي</option>
                    <option value="جعفر حسن عبدالله">العلوم - جعفر حسن عبدالله الزاير</option>
                    <option value="صبري محمد">العلوم - صبري محمد حمد السيد</option>
                    <option value="عبدالرضا عبدالرسول">العلوم - عبدالرضا عبدالرسول عبدالله</option>
                    <option value="محمد محمود">العلوم - محمد محمود محمد سليمان</option>
                    <option value="ايمن محمد بكري">اللغة الإنجليزية - ايمن محمد بكري أحمد</option>
                    <option value="عباس كاظم">اللغة الإنجليزية - عباس كاظم أحمد</option>
                    <option value="حسين السواد">اللغة الإنجليزية - حسين السواد</option>
                    <option value="دانيال نادر">اللغة الإنجليزية - دانيال نادر</option>
                    <option value="منتصرعثمان">اللغة الإنجليزية - منتصرعثمان زيدان ابو زيد</option>
                    <option value="باسم ناصر">اللغة العربية - باسم ناصر سعد رحال</option>
                    <option value="أحمد علي أحمد">اللغة العربية - أحمد علي أحمد</option>
                    <option value="عبدالرزاق محمد">اللغة العربية - عبدالرزاق محمد</option>
                    <option value="عدنان عبدالجليل">اللغة العربية - عدنان عبدالجليل الحلواجي</option>
                    <option value="محمد إبراهيم علي">اللغة العربية - محمد إبراهيم علي آل طوق</option>
                    <option value="ماهر مهدي">اللغة العربية - ماهر مهدي</option>
                    <option value="ياسر عبدالهادي">اللغة العربية - ياسر عبدالهادي الجمري</option>
                    <option value="احمد فراج">المجالات - احمد فراج احمد مصطفى</option>
                    <option value="ايمن خضر">المجالات - ايمن خضر السيد عيسى</option>
                    <option value="جاسم محمد جعفر">المجالات - جاسم محمد جعفر الحداد</option>
                    <option value="حسن حميد">المجالات - حسن حميد محسن علي</option>
                    <option value="درويش يحيى">المجالات - درويش يحي درويش زين الدين</option>
                    <option value="عاطف التهامي">المجالات - عاطف التهامي</option>
                    <option value="عبدالله سند">المجالات - عبدالله سند</option>
                    <option value="علي محسن سيف">المجالات - علي محسن سيف</option>
                    <option value="يوسف علي عبدالحق">المجالات - يوسف علي عبدالحق</option>
                    <option value="السيد البيلي">المجالات - السيد البيلي السيد</option>
                    <option value="السيد محمد ضياء">المواد الاجتماعية - السيد محمد ضياء</option>
                    <option value="جلال إبراهيم">المواد الاجتماعية - جلال إبراهيم ياسين</option>
                    <option value="عبدالله هلال">المواد الاجتماعية - عبدالله هلال</option>
                    <option value="علي عبدالله">المواد الاجتماعية - علي عبدالله</option>
                    <option value="ناصر ماهر">المواد الاجتماعية - ناصر ماهر احمد محمد</option>
                    <option value="السيدحسين هاشم">برنامج معاً - السيدحسين هاشم العلوي</option>
                    <option value="صلاح فؤاد">صلاح فؤاد - سمع ونطق</option>
                    <option value="عبدالله موفق">عبدالله موفق - تربية خاصة</option>
                    <option value="أحمد عبدالمطلب">أحمد عبدالمطلب - تربية خاصة</option>
                    <option value="ابراهيم عبدالنبي">ابراهيم عبدالنبي - رياضة دمج</option>
                </select>
            </div>

            <button onclick="loadTeacherData()" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded hover:bg-green-700 transition">عرض السجل</button>
            <p id="errorMsg" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <div id="teacherDashboard" class="hidden p-4 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
            <h2 id="teacherTitle" class="text-xl font-bold text-green-800"></h2>
            <button onclick="location.reload()" class="bg-gray-200 px-3 py-1 rounded text-sm hover:bg-gray-300">تغيير المعلم</button>
        </div>
        <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold mb-4 text-gray-700 border-b pb-2">سجل الطلاب الغائبين في حصصك:</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-right border-collapse">
                    <thead class="bg-green-100 text-green-800 border-b">
                        <tr><th class="p-2">التاريخ</th><th class="p-2">الصف</th><th class="p-2">الحصة</th><th class="p-2">اسم الطالب</th></tr>
                    </thead>
                    <tbody id="teacherTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxlJnpJN9y9h04cOswtY3BGGwUS8rhybOisxDFkIQJ6_9nFSPMJeK-wiuFEECnBY3v5/exec";

        async function loadTeacherData() {
            const teacher = document.getElementById('teacherSelect').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.querySelector('button');

            if (!teacher) {
                errorMsg.innerText = "الرجاء اختيار اسم المعلم أولاً";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.innerText = "جاري التحميل...";
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}?action=teacher&teacher=${encodeURIComponent(teacher)}`);
                const result = await response.json();

                if (result.status === "success") {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('teacherDashboard').classList.remove('hidden');
                    
                    const selectedName = document.getElementById('teacherSelect').selectedOptions[0].text;
                    document.getElementById('teacherTitle').innerText = `تقارير الغياب الخاصة بـ: ${selectedName}`;

                    const tbody = document.getElementById('teacherTableBody');
                    tbody.innerHTML = "";
                    if(result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">لا توجد حالات غياب مسجلة باسمك حتى الآن</td></tr>`;
                    } else {
                        result.data.forEach(d => {
                            tbody.innerHTML += `<tr class="border-b">
                                <td class="p-2">${d.date}</td><td class="p-2">${d.className}</td>
                                <td class="p-2">الحصة ${d.period}</td><td class="p-2">${d.studentName}</td>
                            </tr>`;
                        });
                    }
                } else {
                    errorMsg.innerText = result.message;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "فشل الاتصال بقاعدة البيانات.";
                errorMsg.classList.remove('hidden');
            }
            btn.innerText = "عرض السجل";
        }
    </script>
</body>
</html>
