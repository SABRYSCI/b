<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط المنظومة المدرسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* اللون الافتراضي الذي يمكن تغييره */
            --primary-color: #1a73e8;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        h1 {
            color: var(--primary-color);
            margin: 0 0 15px 0;
            font-size: 24px;
            text-align: center;
        }

        .settings {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .settings label {
            font-weight: 500;
            font-size: 14px;
        }

        input[type="color"] {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 5px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fdfdfd;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: border-color 0.3s;
        }

        .link-item:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .link-content {
            display: flex;
            align-items: center;
            flex-grow: 1;
            gap: 10px;
        }

        .link-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
        }

        .edit-input {
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            padding: 8px;
            border: 1px solid var(--primary-color);
            border-radius: 6px;
            flex-grow: 1;
            outline: none;
            width: 100%;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-copy, .btn-edit {
            background-color: #e8f0fe;
            color: #333;
            border: 1px solid #ccc;
        }

        .btn-open, .btn-save {
            background-color: var(--primary-color);
            color: white;
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Tajawal', sans-serif;
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* التوافق مع الهواتف المحمولة */
        @media (max-width: 600px) {
            .link-item {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            .link-content {
                width: 100%;
            }
            .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .btn {
                flex: 1;
                justify-content: center;
                padding: 12px 8px; /* تكبير زر اللمس للهواتف */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>روابط المنظومة المدرسية</h1>
            <div class="settings">
                <label for="colorPicker">تخصيص لون الأزرار:</label>
                <input type="color" id="colorPicker" value="#1a73e8" onchange="changeThemeColor(this.value)">
            </div>
        </div>

        <div id="links-container">
            <!-- سيتم توليد الروابط هنا -->
        </div>
    </div>

    <!-- رسالة الإشعار -->
    <div id="toast">تم الإجراء بنجاح!</div>

    <script>
        // الروابط الأساسية 
        const defaultLinksData = [
            { id: "link1", title: "الرئيسية", url: "https://sabrysci.github.io/-a/" },
            { id: "link2", title: "الإرشاد الاجتماعي", url: "https://sabrysci.github.io/b/social.html" },
            { id: "link3", title: "الإدارة", url: "https://sabrysci.github.io/b/admin.html" },
            { id: "link4", title: "الإشراف", url: "https://sabrysci.github.io/b/supervisor.html" },
            { id: "link5", title: "الاستئذان والأعذار", url: "https://sabrysci.github.io/b/excuse.html" },
            { id: "link6", title: "المخالفات", url: "https://sabrysci.github.io/b/violations.html" },
            { id: "link7", title: "المعلم", url: "https://sabrysci.github.io/b/teacher.html" },
            { id: "link8", title: "المخالفات السلوكية", url: "https://sabrysci.github.io/b/Behavioral_Violation.html" },
            { id: "link9", title: "الإحصائيات", url: "https://sabrysci.github.io/b/statistics.html" }
        ];

        // تحميل البيانات المحفوظة أو استخدام الأساسية
        let linksData = JSON.parse(localStorage.getItem('schoolLinksData')) || defaultLinksData;

        // دمج البيانات المحفوظة مع الأساسية
        linksData = defaultLinksData.map(defaultItem => {
            const savedItem = linksData.find(item => item.id === defaultItem.id);
            return savedItem ? savedItem : defaultItem;
        });

        const container = document.getElementById('links-container');
        let editingId = null;

        // دالة رسم الروابط على الصفحة
        function renderLinks() {
            container.innerHTML = '';
            linksData.forEach(item => {
                const linkDiv = document.createElement('div');
                linkDiv.className = 'link-item';
                
                if (editingId === item.id) {
                    // وضع التعديل
                    linkDiv.innerHTML = `
                        <div class="link-content">
                            <input type="text" class="edit-input" id="input-${item.id}" value="${item.title}" placeholder="أدخل اسم الرابط الجديد...">
                        </div>
                        <div class="actions">
                            <button class="btn btn-save" onclick="saveLink('${item.id}')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                                حفظ
                            </button>
                            <button class="btn btn-copy" onclick="cancelEdit()">إلغاء</button>
                        </div>
                    `;
                } else {
                    // وضع العرض الطبيعي
                    linkDiv.innerHTML = `
                        <div class="link-content">
                            <div class="link-title">${item.title}</div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-edit" title="تعديل الاسم" onclick="startEdit('${item.id}')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </button>
                            <button class="btn btn-copy" onclick="copyLink('${item.url}')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                نسخ
                            </button>
                            <a href="${item.url}" target="_blank" class="btn btn-open">
                                فتح
                            </a>
                        </div>
                    `;
                }
                container.appendChild(linkDiv);
            });
        }

        // بدء تعديل الرابط
        function startEdit(id) {
            editingId = id;
            renderLinks();
        }

        // إلغاء التعديل
        function cancelEdit() {
            editingId = null;
            renderLinks();
        }

        // حفظ الاسم الجديد
        function saveLink(id) {
            const input = document.getElementById(`input-${id}`);
            const newTitle = input.value.trim();
            
            if(newTitle !== "") {
                const linkIndex = linksData.findIndex(item => item.id === id);
                if (linkIndex !== -1) {
                    linksData[linkIndex].title = newTitle;
                    // حفظ في المتصفح
                    localStorage.setItem('schoolLinksData', JSON.stringify(linksData));
                }
            }
            
            editingId = null;
            renderLinks();
            showToast("تم حفظ الاسم بنجاح!");
        }

        // دالة نسخ الرابط
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast("تم نسخ الرابط للواتساب بنجاح!");
            }).catch(err => {
                console.error('فشل في نسخ الرابط: ', err);
            });
        }

        // دالة تغيير وحفظ لون التصميم
        function changeThemeColor(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('schoolThemeColor', color);
        }

        // استرجاع اللون المحفوظ عند فتح الصفحة
        function loadSavedColor() {
            const savedColor = localStorage.getItem('schoolThemeColor');
            if (savedColor) {
                document.documentElement.style.setProperty('--primary-color', savedColor);
                document.getElementById('colorPicker').value = savedColor;
            }
        }

        // دالة إظهار الإشعارات
        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // التهيئة الأولية عند فتح الصفحة
        loadSavedColor();
        renderLinks();
    </script>
</body>
</html>
