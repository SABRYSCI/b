<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>بوابة المدير - مدرسة البلاد القديم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
:root{--p:#4338ca;--pd:#312e81;--bg:#f1f5f9;--tx:#1e293b;--bd:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx)}
button{font-family:inherit}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;width:100%;max-width:400px;padding:28px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.12);border-top:5px solid var(--p);text-align:center}
.card img{max-width:100%;max-height:80px}
.card h2{margin:12px 0 4px;color:var(--p)}
.card p{margin:0 0 16px;color:#64748b;font-size:.9rem}
.card input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;font:inherit;font-size:1.1rem;margin-bottom:12px}
.card button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--p);color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer}
.card button:disabled{opacity:.6}
#msg{color:#dc2626;font-weight:700;margin-top:10px;min-height:1.2em}
#app{display:none;height:100vh}
#app.on{display:flex}
aside{width:270px;background:var(--pd);color:#fff;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.brand{padding:14px;text-align:center;border-bottom:1px solid rgba(255,255,255,.15);font-weight:800}
.brand img{max-width:100%;background:#fff;border-radius:8px;padding:4px;margin-bottom:6px}
.grp{padding:12px 16px 4px;font-size:.78rem;opacity:.65;font-weight:800}
.nav{display:block;width:100%;padding:10px 16px;background:none;border:0;border-right:4px solid transparent;color:#fff;font-weight:700;font-size:.95rem;text-align:right;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:rgba(255,255,255,.16);border-right-color:#fbbf24}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd)}
header h1{margin:0;font-size:1.1rem}
.hb{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--tx);font-size:.9rem}
#menuBtn{display:none}
#home{padding:20px;overflow-y:auto;flex:1}
#home h2{margin:0 0 14px}
#home h2 small{font-weight:500;color:#64748b;font-size:.85rem;margin-right:8px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06);border-bottom:4px solid var(--p)}
.k b{display:block;font-size:1.9rem;margin-top:4px}
.k span{font-size:.85rem;color:#64748b;font-weight:700}
.k.r{border-color:#dc2626}.k.r b{color:#dc2626}.k.y{border-color:#ca8a04}.k.y b{color:#ca8a04}.k.c{border-color:#0891b2}.k.c b{color:#0891b2}.k.g{border-color:#16a34a}.k.g b{color:#16a34a}
#kt{font-size:.8rem;color:#64748b;margin:8px 0 18px}
#home h3{margin:18px 0 10px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.s{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:right;font-weight:700;cursor:pointer}
.s:hover{border-color:var(--p);box-shadow:0 4px 10px rgba(67,56,202,.15)}
#frameWrap{flex:1;position:relative;display:none}
#frame{width:100%;height:100%;border:0;background:#fff}
#spin{position:absolute;inset:0;background:rgba(255,255,255,.9);display:none;align-items:center;justify-content:center;font-weight:800;color:var(--p);font-size:1.2rem}
@media(max-width:800px){
aside{position:fixed;top:0;bottom:0;right:0;z-index:50;transform:translateX(100%);transition:.2s}
aside.open{transform:none}
#menuBtn{display:inline-block}
}
</style>
</head>
<body>

<div id="login">
    <div class="card">
        <img src="https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png" alt="">
        <h2>بوابة المدير</h2>
        <p>أدخل كلمة مرور المدير للدخول إلى جميع الأنظمة</p>
        <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
        <button id="lbtn" onclick="login()">دخول</button>
        <div id="msg"></div>
    </div>
</div>

<div id="app">
    <aside id="aside">
        <div class="brand"><img src="https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png" alt=""><div>مدرسة البلاد القديم</div></div>
        <nav id="nav"></nav>
        <div style="flex:1"></div>
        <button class="nav" onclick="logout()">🚪 تسجيل الخروج</button>
    </aside>
    <main>
        <header>
            <button class="hb" id="menuBtn" onclick="$('aside').classList.toggle('open')">☰</button>
            <h1 id="title"></h1>
            <span style="flex:1"></span>
            <button class="hb" id="refBtn" onclick="kpis()">🔄 تحديث المؤشرات</button>
            <button class="hb" id="prBtn" onclick="printFrame()">🖨️ طباعة</button>
            <a class="hb" id="openNew" target="_blank" rel="noopener" title="قد تطلب الصفحة كلمة المرور من جديد">↗ تبويب جديد</a>
        </header>

        <section id="home">
            <h2>مرحباً بك أستاذ محمد 👋 <small id="today"></small></h2>
            <div class="kg">
                <div class="k"><span>إجمالي الطلاب</span><b id="k1">—</b></div>
                <div class="k r"><span>غياب كلي اليوم</span><b id="k2">—</b></div>
                <div class="k y"><span>تأخير صباحي</span><b id="k3">—</b></div>
                <div class="k c"><span>استئذان</span><b id="k4">—</b></div>
                <div class="k g"><span>نسبة الحضور</span><b id="k5">—</b></div>
            </div>
            <div id="kt"></div>
            <h3>الوصول السريع</h3>
            <div class="sg" id="sg"></div>
        </section>

        <div id="frameWrap"><div id="spin">⏳ جاري التحميل...</div><iframe id="frame" title="content"></iframe></div>
    </main>
</div>

<script>
    // رابط Google Apps Script الرئيسي
    const API = "https://script.google.com/macros/s/AKfycbxlJnpJN9y9h04cOswtY3BGGwUS8rhybOisxDFkIQJ6_9nFSPMJeK-wiuFEECnBY3v5/exec";

    // ⚙️ عدّل أسماء الملفات (u) هنا إن اختلفت في المستودع. login = اسم دالة الدخول في الصفحة ليتم تنفيذها تلقائياً بالرمز.
    const MENU = [
        { g: 'الرئيسية', items: [{ id: 'home', t: '🏠 الصفحة الرئيسية' }] },
        { g: 'الحضور والغياب', items: [
            { id: 'stats', t: '📊 الإحصائيات والتقارير الشهرية', u: 'statistics.html', login: 'authenticate' },
            { id: 'sup',   t: '⚡ الرصد اللحظي للحصص',          u: 'supervisor.html', login: 'authenticateSupervisor' },
            { id: 'cum',   t: '⚠️ الغياب التراكمي',             u: 'absences.html' },
            { id: 'daily', t: '📋 كشف الغياب اليومي (وزاري)',   u: 'daily_absence_report.html', login: 'authenticate' }
        ]},
        { g: 'السلوك', items: [
            { id: 'vio', t: '🛑 سجل المخالفات السلوكية',     u: 'violations.html' },
            { id: 'beh', t: '📝 النظام الموحد لمتابعة السلوك', u: 'Behavioral_Violation.html' }
        ]},
        { g: 'الإرشاد الاجتماعي', items: [
            { id: 'soc', t: '⏱️ التأخير والاستئذان',          u: 'social.html', login: 'loginSocial' },
            { id: 'exc', t: '📄 نموذج العذر (ولي الأمر)',      u: 'excuse.html' }
        ]},
        { g: 'الطلاب والمعلمون', items: [
            { id: 'stu', t: '🔍 البحث وملف الطالب',           u: 'Student_search.html' },
            { id: 'tea', t: '👨‍🏫 بوابة المعلمين',              u: 'teacher.html' }
        ]},
        { g: 'أخرى', items: [
            { id: 'vis', t: '👥 سجل الزوار', u: '/Visitors/' }
        ]}
    ];
    const ALL = MENU.flatMap(m => m.items);
    const $ = id => document.getElementById(id);
    let tok = sessionStorage.getItem('adm_tok');

    async function post(body) {
        const r = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
        return r.json();
    }

    async function login() {
        const p = $('pw').value;
        if (!p) return;
        $('lbtn').disabled = true; $('msg').textContent = '';
        try {
            const r = await post({ action: 'adminLogin', password: p });
            if (r.status === 'success' && r.token) {
                tok = r.token;
                sessionStorage.setItem('adm_tok', tok);
                $('pw').value = '';
                start();
            } else { $('msg').textContent = r.message || 'كلمة المرور غير صحيحة'; }
        } catch (e) { $('msg').textContent = 'تعذر الاتصال بالخادم'; }
        $('lbtn').disabled = false;
    }

    async function boot() {
        if (!tok) return;
        try {
            const r = await (await fetch(`${API}?action=adminCheck&token=${encodeURIComponent(tok)}`)).json();
            if (r.status === 'success') return start();
        } catch (e) {}
        sessionStorage.removeItem('adm_tok'); tok = null;
    }

    function logout() {
        if (tok) post({ action: 'adminLogout', token: tok }).catch(() => {});
        sessionStorage.removeItem('adm_tok');
        location.hash = '';
        location.reload();
    }

    function start() {
        $('login').style.display = 'none';
        $('app').classList.add('on');
        $('today').textContent = new Date().toLocaleDateString('ar-BH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        let nav = '', sg = '';
        MENU.forEach(m => {
            nav += `<div class="grp">${m.g}</div>`;
            m.items.forEach(i => {
                nav += `<button class="nav" data-id="${i.id}" onclick="go('${i.id}')">${i.t}</button>`;
                if (i.u) sg += `<button class="s" onclick="go('${i.id}')">${i.t}</button>`;
            });
        });
        $('nav').innerHTML = nav; $('sg').innerHTML = sg;
        go(location.hash.slice(1) || 'home');
        kpis();
    }

    function go(id) {
        const it = ALL.find(x => x.id === id) || ALL[0];
        document.querySelectorAll('.nav[data-id]').forEach(b => b.classList.toggle('on', b.dataset.id === it.id));
        $('title').textContent = it.t;
        $('aside').classList.remove('open');
        location.hash = it.id;
        const home = it.id === 'home';
        $('home').style.display = home ? 'block' : 'none';
        $('frameWrap').style.display = home ? 'none' : 'block';
        $('refBtn').style.display = home ? '' : 'none';
        $('openNew').style.display = home ? 'none' : '';
        if (home) return;
        $('openNew').href = it.u;
        $('spin').style.display = 'flex';
        const f = $('frame');
        f.onload = () => afterLoad(f, it);
        f.src = it.u;
    }

    // تسجيل الدخول التلقائي داخل الصفحة المحمّلة (نفس النطاق) باستخدام رمز المدير
    function afterLoad(f, it) {
        $('spin').style.display = 'none';
        if (!it.login) return;
        try {
            const w = f.contentWindow, i = f.contentDocument.getElementById('passInput');
            if (i && typeof w[it.login] === 'function') { i.value = tok; w[it.login](); }
        } catch (e) {}
    }

    function printFrame() {
        try { $('frame').contentWindow.focus(); $('frame').contentWindow.print(); } catch (e) { window.print(); }
    }

    const cl = n => String(n || '').replace(/^[\d\s._-]+/, '').trim();
    async function kpis() {
        $('kt').textContent = '⏳ جاري جلب مؤشرات اليوم...';
        try {
            const r = await (await fetch(`${API}?action=dashboard_data&pass=${encodeURIComponent(tok)}`)).json();
            if (r.status !== 'success') { $('kt').textContent = 'تعذر جلب المؤشرات: ' + (r.message || ''); return; }
            const t = new Date().toLocaleDateString('en-CA'), cp = {}, sp = {}, ls = {};
            let late = 0, leave = 0, abs = 0;
            r.records.forEach(x => {
                if (x.date !== t || !x.period) return;
                (cp[x.className] = cp[x.className] || {})[x.period] = 1;
                if (!String(x.studentName).includes('لا يوجد')) {
                    const k = x.className + '|' + cl(x.studentName);
                    (sp[k] = sp[k] || {})[x.period] = 1;
                }
            });
            r.lates.forEach(l => {
                if (l.date !== t) return;
                ls[cl(l.studentName)] = 1;
                String(l.excuseType).includes('استئذان') ? leave++ : late++;
            });
            for (const k in sp) {
                const [c, n] = k.split('|');
                if (ls[n]) continue;
                if (Object.keys(sp[k]).length >= Object.keys(cp[c]).length) abs++;
            }
            const N = Object.values(r.classTotals).reduce((a, b) => a + b, 0);
            $('k1').textContent = N; $('k2').textContent = abs; $('k3').textContent = late; $('k4').textContent = leave;
            $('k5').textContent = N ? ((N - abs) / N * 100).toFixed(1) + '%' : '-';
            $('kt').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-BH') + ' — الغياب الكلي = من لم يحضر أي حصة في يومه';
        } catch (e) { $('kt').textContent = 'تعذر الاتصال بالخادم'; }
    }

    boot();
</script>
</body>
</html>
