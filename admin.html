<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المدير - لوحة القيادة الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .hidden { display: none; }
        .active-period { background-color: #7c3aed !important; color: white !important; font-weight: bold; border-color: #6d28d9 !important; }
        @media print {
            body { background: white !important; margin: 0 !important; }
            .no-print { display: none !important; }
            table { page-break-inside: avoid; }
            @page { size: A4 portrait; margin: 8mm; }
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 no-print">
        <div class="bg-white p-8 rounded-lg shadow-md w-96 border-t-4 border-purple-600">
            <div class="text-center mb-4">
                <img src="https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png" class="max-h-20 mx-auto mb-3">
                <h1 class="text-2xl font-bold text-purple-800">بوابة المدير الشاملة</h1>
            </div>
            <input type="password" id="passInput" class="w-full p-2 border rounded mb-4 text-center font-bold" placeholder="admin123">
            <button onclick="loginAdmin()" class="w-full bg-purple-700 text-white font-bold py-2 rounded">دخول اللوحة</button>
            <p id="errorMsg" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <div id="adminDashboard" class="hidden p-4 max-w-7xl mx-auto flex-grow w-full">
        <div class="mb-5 bg-white p-4 rounded shadow border-b">
            <img src="https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png" class="w-full max-h-24 object-contain mx-auto mb-2">
            <div class="flex justify-between items-center gap-3 mt-1">
                <div>
                    <h2 class="text-xl font-bold text-purple-950">التقرير الميداني الشامل للمدرسة</h2>
                    <div class="flex items-center gap-3 mt-1">
                        <span id="lastUpdatedBadge" class="text-[11px] bg-purple-50 text-purple-700 px-2 py-0.5 rounded font-bold">🟢 متصل ومحدّث</span>
                    </div>
                </div>
                <div class="flex items-center gap-2 no-print">
                    <button id="refreshBtn" onclick="refreshAdminData(false)" class="bg-purple-700 hover:bg-purple-800 text-white font-bold py-2 px-3 rounded text-sm shadow">🔄 تحديث</button>
                    <button onclick="window.print()" class="bg-blue-600 text-white font-bold py-2 px-3 rounded text-sm shadow">🖨️ طباعة</button>
                    <button onclick="location.reload()" class="bg-gray-200 px-3 py-2 rounded text-sm font-bold">خروج</button>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded shadow mb-5 border-r-4 border-purple-600">
            <div class="grid grid-cols-4 md:grid-cols-7 gap-2 mb-5 no-print">
                <button onclick="selectPeriod(1)" id="btnP1" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 1</button>
                <button onclick="selectPeriod(2)" id="btnP2" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 2</button>
                <button onclick="selectPeriod(3)" id="btnP3" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 3</button>
                <button onclick="selectPeriod(4)" id="btnP4" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 4</button>
                <button onclick="selectPeriod(5)" id="btnP5" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 5</button>
                <button onclick="selectPeriod(6)" id="btnP6" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 6</button>
                <button onclick="selectPeriod(7)" id="btnP7" class="period-btn py-1.5 border rounded text-xs font-bold bg-gray-50">الحصة 7</button>
            </div>

            <div class="mb-5 grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                <div class="bg-white p-3 border border-t-4 border-t-blue-500"><p class="text-[11px] text-gray-500">الطلاب</p><p id="pSumTotal" class="text-xl font-bold">0</p></div>
                <div class="bg-white p-3 border border-t-4 border-t-green-500"><p class="text-[11px] text-gray-500">الحضور</p><p id="pSumPresent" class="text-xl font-bold text-green-600">0</p></div>
                <div class="bg-white p-3 border border-t-4 border-t-red-500"><p class="text-[11px] text-gray-500">الغياب</p><p id="pSumAbsent" class="text-xl font-bold text-red-600">0</p></div>
                <div class="bg-white p-3 border border-t-4 border-t-yellow-500"><p class="text-[11px] text-gray-500">النسبة</p><p id="pSumPercent" class="text-xl font-bold text-yellow-600">0%</p></div>
            </div>

            <div class="overflow-x-auto border border-gray-200 rounded">
                <table class="w-full text-xs text-right border-collapse">
                    <thead class="bg-purple-50 text-purple-950 font-bold border-b">
                        <tr>
                            <th class="p-2 border text-center">الصف</th><th class="p-2 border text-center">حالة الرصد</th><th class="p-2 border">المعلم الراصد</th>
                            <th class="p-2 border text-center">الطلاب</th><th class="p-2 border text-center">الحضور</th><th class="p-2 border text-center">الغياب</th>
                            <th class="p-2 border min-w-[220px]">الغياب والتأخير</th>
                        </tr>
                    </thead>
                    <tbody id="periodTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxlJnpJN9y9h04cOswtY3BGGwUS8rhybOisxDFkIQJ6_9nFSPMJeK-wiuFEECnBY3v5/exec";
        let globalData = null; let activePeriodNum = 1; let currentPass = ""; let timer = null;

        function isNoAbsenceText(name) { return /لا\s*يوجد|حضور|الجميع/i.test(String(name||'').trim()); }
        function cleanClass(str) { return String(str||'').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\s\-_/\\.]/g, '').trim(); }
        function cleanNameDisplay(name) { return String(name || '').replace(/^\s*\d+\s*[-_.]?\s*/, '').trim(); }

        function getClassTotal(cName) {
            const target = cleanClass(cName);
            for (let k in globalData.classTotals) if (cleanClass(k) === target && globalData.classTotals[k] > 0) return globalData.classTotals[k];
            return 31;
        }

        async function loginAdmin() {
            const pass = document.getElementById('passInput').value;
            if (!pass) return;
            currentPass = pass;
            if (await fetchAdminData(pass)) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                if (timer) clearInterval(timer);
                timer = setInterval(() => refreshAdminData(true), 40000);
            }
        }

        async function fetchAdminData(pass, isSilent = false) {
            try {
                const res = await fetch(`${API_URL}?action=supervisor&pass=${pass}&_t=${Date.now()}`);
                const result = await res.json();
                if (result.status === "success" && result.stage === "all") {
                    globalData = result;
                    document.getElementById('lastUpdatedBadge').innerText = `🟢 التحديث: ${new Date().toLocaleTimeString('ar-EG')}`;
                    selectPeriod(activePeriodNum);
                    return true;
                }
            } catch (err) {} return false;
        }

        async function refreshAdminData(isSilent) {
            if(!currentPass) return;
            if(!isSilent) document.getElementById('refreshBtn').innerText = "⏳ تحديث...";
            await fetchAdminData(currentPass, isSilent);
            if(!isSilent) document.getElementById('refreshBtn').innerText = "🔄 تحديث";
        }

        function selectPeriod(pNum) {
            activePeriodNum = pNum;
            document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active-period'));
            document.getElementById(`btnP${pNum}`).classList.add('active-period');

            const tbody = document.getElementById('periodTableBody');
            tbody.innerHTML = "";
            let tStudents = 0, tAbsents = 0;

            globalData.classes.forEach(cName => {
                const cTotal = getClassTotal(cName);
                tStudents += cTotal;
                const recs = globalData.data.filter(r => cleanClass(r.className) === cleanClass(cName) && String(r.period).replace(/\D/g,'') === String(pNum));
                const isRec = recs.length > 0;
                
                let absNamesRaw = recs.filter(r => r.studentName && !isNoAbsenceText(r.studentName) && !r.isLate).map(r => cleanNameDisplay(r.studentName));
                let lateNamesRaw = recs.filter(r => r.studentName && !isNoAbsenceText(r.studentName) && r.isLate).map(r => cleanNameDisplay(r.studentName));
                
                let absNames = [...new Set(absNamesRaw)];
                let lateNames = [...new Set(lateNamesRaw)];
                
                let absCount = absNames.length;
                let presCount = isRec ? Math.max(0, cTotal - absCount) : cTotal;
                if (isRec) tAbsents += absCount;

                let html = "";
                if (absNames.length > 0) html += `<ol class="list-decimal list-inside text-red-600 font-bold">` + absNames.map(n=>`<li>${n}</li>`).join('') + `</ol>`;
                if (lateNames.length > 0) html += `<div class="mt-1 pt-1 border-t"><p class="text-[10px] text-orange-600 font-bold mb-0.5">متأخر صباحياً:</p><ul class="list-disc list-inside text-orange-600 font-bold text-[11px]">` + lateNames.map(n=>`<li>${n}</li>`).join('') + `</ul></div>`;
                if (absNames.length===0 && lateNames.length===0 && isRec) html = `<span class="text-green-700 font-bold bg-green-50 px-2 py-0.5 rounded">✅ الجميع حضور</span>`;
                else if (!isRec) html = `<span class="text-gray-400">-</span>`;

                tbody.innerHTML += `<tr class="border-b hover:bg-gray-50">
                    <td class="p-2 border font-bold text-center">${cName}</td>
                    <td class="p-2 border text-center font-bold">${isRec ? '<span class="text-green-600">✅ تم الرصد</span>' : '<span class="text-red-500">❌ لم يُرصد</span>'}</td>
                    <td class="p-2 border font-medium">${isRec ? recs[0].teacher : '-'}</td>
                    <td class="p-2 border text-center">${cTotal}</td><td class="p-2 border text-green-700 text-center">${isRec ? presCount : '-'}</td><td class="p-2 border text-red-600 text-center">${isRec ? absCount : '-'}</td>
                    <td class="p-2 border">${html}</td></tr>`;
            });

            document.getElementById('pSumTotal').innerText = tStudents;
            document.getElementById('pSumPresent').innerText = Math.max(0, tStudents - tAbsents);
            document.getElementById('pSumAbsent').innerText = tAbsents;
            document.getElementById('pSumPercent').innerText = tStudents > 0 ? ((tAbsents/tStudents)*100).toFixed(1)+"%" : "0%";
        }
    </script>
</body>
</html>
